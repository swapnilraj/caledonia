name: CI

on:
  push:
    branches: [main, vibing]
  pull_request:

permissions:
  contents: read

jobs:
  ocaml:
    name: OCaml ${{ matrix.ocaml-compiler }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ocaml-compiler: 5.1.1
          - os: ubuntu-latest
            ocaml-compiler: 5.2.1
          - os: ubuntu-latest
            ocaml-compiler: 5.3.0
          - os: macos-latest
            ocaml-compiler: 5.2.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: avsm/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          cache-prefix: v1
      - name: Lint package metadata
        run: opam lint caledonia.opam
      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Install formatter
        run: opam install ocamlformat.0.29.0 --yes
      - name: Check formatting
        run: opam exec -- dune fmt && git diff --exit-code
      - name: Install package with mandatory tests
        run: opam install . --with-test --yes
      - name: Smoke-test installed artifacts
        run: |
          test "$(opam exec -- caled --version)" = "0.5.0"
          test -f "$(opam var share)/caledonia/caledonia.el"
          test -f "$(opam var share)/caledonia/caledonia-evil.el"
      - name: Build package and all targets
        run: opam exec -- dune build @all
      - name: Run tests
        run: opam exec -- dune runtest
      - name: Check generated diffs
        run: git diff --exit-code

  emacs:
    name: Emacs ${{ matrix.emacs-version }} frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['27.1', '30.2']
    steps:
      - uses: actions/checkout@v4
      - uses: avsm/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
          cache-prefix: v1
      - name: Install Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs-version }}
      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Build server
        run: opam exec -- dune build bin/main.exe
      - name: Byte-compile Emacs frontend
        run: >-
          emacs --batch -Q -L emacs
          --eval '(setq byte-compile-error-on-warn t)'
          -f batch-byte-compile emacs/caledonia.el emacs/caledonia-evil.el
      - name: Run ERT
        run: emacs --batch -Q -L emacs -l emacs/test-caledonia.el -f ert-run-tests-batch-and-exit
      - name: Check generated diffs
        run: git diff --exit-code
